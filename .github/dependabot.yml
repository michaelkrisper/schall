# Weekly dependency updates; minor and patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /wasm
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
