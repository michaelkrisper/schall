name: Deploy

# Lints (rustfmt, clippy, Biome), builds the Rust DSP core to WebAssembly,
# runs all tests (including the app in headless Chrome with a fake
# microphone) and publishes src/ to GitHub Pages on every push to main. The
# service worker gets the commit stamped in, so each release installs a fresh
# app cache.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - run: npm ci
      - run: npm run lint:rust
      - run: npm run wasm
      - run: npm run check
      - name: Stamp version
        if: github.event_name != 'pull_request'
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" src/sw.js
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: src

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: pages
        uses: actions/deploy-pages@v5

      - name: Smoke test
        run: |
          set -euo pipefail
          live="${{ steps.pages.outputs.page_url }}"
          for f in "" sw.js manifest.webmanifest dsp.wasm js/main.js js/worklet.js icons/icon-192.png; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f returned $code"; exit 1; }
          done
          curl -s "${live}sw.js" | grep -q "'${GITHUB_SHA::8}'" || { echo "::error::sw.js is not stamped with this commit"; exit 1; }
          curl -sI "${live}dsp.wasm" | grep -qi '^content-type: application/wasm' || { echo "::error::dsp.wasm has the wrong content type"; exit 1; }
