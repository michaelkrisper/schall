name: Test and deploy

# Lints (rustfmt, clippy, Biome), runs the Rust unit tests, builds the Rust
# DSP core to WebAssembly, runs all tests (including the app in headless Chrome with a fake
# microphone) and publishes src/ to GitHub Pages on every push to main. The
# service worker gets the commit stamped in, so each release installs a fresh
# app cache, and the settings show the version tag the commit got.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustup component add rustfmt clippy
      - run: npm ci
      - run: npm run lint:rust
      - run: npm run test:rust
      - run: npm run wasm
      - run: npm run check
      # Unstamped: the version tag only exists once the version job has run.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: src
          retention-days: 1

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    # Only commits that got a version tag: a re-run of an older run deploys nothing.
    needs: [test, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" site/sw.js
          sed -i "s/__APP_VERSION__/${VERSION#v}/" site/index.html
          grep -q "'${GITHUB_SHA::8}'" site/sw.js
          grep -q ">${VERSION#v}<" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/configure-pages@v6
      - id: pages
        uses: actions/deploy-pages@v5

      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          live="${{ steps.pages.outputs.page_url }}"
          for f in "" sw.js manifest.webmanifest dsp.wasm js/main.js js/worklet.js icons/icon-192.png; do
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$live$f" || echo 000)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "/$f -> $code"
            [ "$code" = 200 ] || { echo "::error::/$f returned $code"; exit 1; }
          done
          curl -s "${live}sw.js" | grep -q "'${GITHUB_SHA::8}'" || { echo "::error::sw.js is not stamped with this commit"; exit 1; }
          curl -s "$live" | grep -q ">${VERSION#v}<" || { echo "::error::index.html is not stamped with ${VERSION}"; exit 1; }
          curl -sI "${live}dsp.wasm" | grep -qi '^content-type: application/wasm' || { echo "::error::dsp.wasm has the wrong content type"; exit 1; }
